apiVersion: apps/v1
kind: Deployment
metadata:
  name: youtube-backend
  namespace: youtube
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: # keep image name from dockerhub
          ports:
            - containerPort: 5004
          env:
            - name: CLIENT_URL
              value: #keep your client url
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5004
            initialDelaySeconds: 10
            periodSeconds: 10
