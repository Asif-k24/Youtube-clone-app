apiVersion: apps/v1
kind: Deployment
metadata:
  name: youtube-frontend
  namespace: youtube
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: # keep your frontend image from dockerhub
          ports:
            - containerPort: 5173
          envFrom:
            - configMapRef:
                name: frontend-config
