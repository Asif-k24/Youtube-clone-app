apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      smtp_smarthost: 'smtp.gmail.com:587'
      smtp_from: 'your_gmail'
      smtp_auth_username: 'your_gmail'
      smtp_auth_password: 'gmail_app_password'
      smtp_require_tls: true

    route:
      receiver: email-alert

    receivers:
    - name: email-alert
      email_configs:
      - to: 'your_gmail'
        send_resolved: true
